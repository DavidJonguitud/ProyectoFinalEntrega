repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v6.0.0
  #   hooks:
  #     - id: trailing-whitespace
  #     - id: end-of-file-fixer
  #     - id: check-yaml
  - repo: local
    hooks:
      - id: pytest-fast
        name: Run fast tests
        entry: poetry run pytest --durations=0
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
